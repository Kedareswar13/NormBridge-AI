# Runs on every push / PR: fast unit tests (no models, no database) and a production build of the UI.
# The golden-set evals need Ollama + Postgres, so they run locally: scripts/run_evals.py --min-pass-rate 0.85
name: tests

on:
  push:
  pull_request:

jobs:
  backend-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies (pure-Python pieces only)
        run: pip install flask python-dotenv psycopg2-binary requests pytest
      - name: Unit tests (security layers, evaluator, RRF, query rewriting, session tokens)
        env:
          SESSION_SECRET: ci-only-secret
        run: python -m pytest tests -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
